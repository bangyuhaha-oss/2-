{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block content %}<section class="panel narrow"><p class="eyebrow">REQUEST {{ code }}</p><h1>{{ 'Access restricted' if code == 403 else 'Unable to complete this request' }}</h1><p>{{ message }}</p><a class="button primary" href="{{ url_for('home') }}">Back to workspace</a></section>{% endblock %}
